services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: telegram_pm
      POSTGRES_USER: telegram_pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram_pm -d telegram_pm"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      ConnectionStrings__Database: "Host=db;Database=telegram_pm;Username=telegram_pm;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      Database__AutoMigrate: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  postgres-data:
